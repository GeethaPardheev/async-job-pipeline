name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobq
          POSTGRES_PASSWORD: jobq
          POSTGRES_DB: jobq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobq -d jobq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://jobq:jobq@localhost:5432/jobq?sslmode=disable
      DATABASE_URL: postgres://jobq:jobq@localhost:5432/jobq?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: go build
        run: go build ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Integration tests (postgres:18)
        run: go test -race -count=1 -tags=integration ./internal/integration/...

      - name: Migrations idempotent via binary
        run: |
          go build -o bin/server ./cmd/server
          ./bin/server migrate
          ./bin/server migrate

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t jobq:ci .
